<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Prerender: wait for the app to signal content is ready (see src/components/PrerenderReady.tsx). No-op for normal visitors. -->
    <script>window.prerenderReady = false;</script>
    <!-- Theme before the first paint, the same rules as src/contexts/ThemeContext.tsx: the visitor's
         stored choice (light / dark / system) wins; with none, the data bundle pages (preview and
         launch addresses) start dark, every other page light. Without this, a prerendered data bundle
         page shows light until the app loads, then turns dark. The data bundle pages' "A+" (bigger
         text, src/components/data-bundles/shared.tsx largeTextCss) is applied here too, so the page
         does not jump when the app loads. No AdSense change. -->
    <style>html[data-db-text="large"] main#main-content { zoom: 1.125; }
@media (max-width: 639px) { html[data-db-text="large"] [data-bf-chips] { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 639px) { html[data-db-text="large"] [data-testid="compare-all"] { flex-basis: 100%; } }</style>
    <script>
      (function () {
        try {
          var t = null, big = null;
          var db = /^\/(?:tools-preview\/)?data-bundles\/ghana(?:\/(?:at|mtn|telecel))?\/?$/.test(window.location.pathname);
          try { t = window.localStorage.getItem("techtrendi-theme"); big = window.localStorage.getItem("techtrendi-db-text"); } catch (e) {}
          if (db && big === "large") document.documentElement.setAttribute("data-db-text", "large");
          if (t !== "light" && t !== "dark" && t !== "system") t = db ? "dark" : null;
          if (!t) return;
          var dark = t === "dark" || (t === "system" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var c = document.documentElement.classList;
          c.remove("light", "dark");
          c.add(dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <!-- title, description, keywords, author, canonical, robots, Open Graph &
         Twitter tags are injected PER PAGE by SEOHead via vite-react-ssg <Head>.
         Do NOT add static versions here — they block/duplicate the per-page ones. -->

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="googled7c567aac507448a" />
    <!-- Bing Webmaster Tools Verification -->
    <meta name="msvalidate.01" content="25E1D3FED6D9D6816000DEE936ECEBC8" />

    <!-- Security headers are set via .htaccess for better browser compatibility -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- robots, Open Graph & Twitter tags injected per-page by SEOHead -->

    <!-- PWA & Mobile -->
    <meta name="theme-color" content="#0066FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TechTrendi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3437377907350211" crossorigin="anonymous"></script>
  </head>

  </body>
</html>
