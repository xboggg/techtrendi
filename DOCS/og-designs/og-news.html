<html><head><meta charset="utf-8">
<style>

  .chip i { width: 11px; height: 11px; border-radius: 50%; }

  /* right: a phone showing a news feed */
  .phone { position: absolute; left: 800px; top: 38px; width: 300px; height: 520px; border-radius: 46px; background: #f5f7fb;

  .notch { width: 96px; height: 24px; border-radius: 14px; background: #1e293b; margin: 10px auto 14px; }
  .screen { position: absolute; left: 0; top: 42px; width: 100%; height: calc(100% - 42px); object-fit: cover; object-position: top; }
  .phone .notch { position: absolute; left: 50%; top: 10px; margin: 0 0 0 -48px; z-index: 2; }
  .item { margin: 0 16px 14px; border-radius: 18px; background: rgba(255,255,255,.06); overflow: hidden; }
  .item .pic { height: 92px; }
  .item .tx { padding: 11px 13px 13px; }
  .item .k { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
  .ln { height: 10px; border-radius: 6px; background: rgba(255,255,255,.55); margin-top: 9px; }
  .ln.s { background: rgba(255,255,255,.22); }
  .bubble { position: absolute; display: flex; align-items: center; gap: 12px; background: #0f1a33; border: 2px solid rgba(255,255,255,.14);

  .bubble .ic { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; }
  .bubble small { display: block; font-size: 13px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #93c5fd; }
  .b1 { left: 662px; top: 120px; transform: rotate(-4deg); }
  .b2 { left: 680px; top: 400px; transform: rotate(3deg); }
  .flags { display: flex; gap: 6px; }
  .flags img { width: 30px; height: 22px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
