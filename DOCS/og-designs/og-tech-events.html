<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Segoe UI", "Inter", Arial, sans-serif;
    background: #070b18; color: #fff; position: relative; }
  .glow1 { position: absolute; left: -220px; top: -260px; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,70,229,.55) 0%, rgba(79,70,229,0) 65%); }
  .glow2 { position: absolute; right: -200px; bottom: -280px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(16,185,129,.38) 0%, rgba(16,185,129,0) 65%); }
  .grid { position: absolute; inset: 0; opacity: .09;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse at 40% 50%, #000 25%, transparent 75%); }

  .wrap { position: absolute; left: 64px; top: 56px; width: 610px; }
  .tag { display: inline-flex; align-items: center; gap: 10px; background: rgba(16,185,129,.14); border: 2px solid rgba(52,211,153,.55);
    color: #6ee7b7; font-weight: 800; font-size: 20px; letter-spacing: .07em; text-transform: uppercase; padding: 8px 18px; border-radius: 999px; }
  .tag i { width: 12px; height: 12px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 5px rgba(52,211,153,.25), 0 0 16px #34d399; }
  h1 { font-size: 88px; line-height: .98; font-weight: 900; margin-top: 26px; letter-spacing: -.025em; }
  h1 span { background: linear-gradient(90deg, #34d399 0%, #22d3ee 45%, #818cf8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 28px; margin-top: 20px; color: #cbd5e1; font-weight: 600; line-height: 1.3; }
  .flags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .fl { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 9px 18px 9px 12px; font-size: 23px; font-weight: 800; }
  .fl img { height: 24px; width: 32px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); object-fit: cover; }
  .fl.more { color: #a5b4fc; border-style: dashed; padding-left: 18px; }

  .foot { position: absolute; left: 64px; bottom: 40px; font-size: 22px; font-weight: 700; color: #94a3b8; }
  .foot b { color: #e2e8f0; }
  .brand { position: absolute; right: 56px; bottom: 34px; font-size: 32px; font-weight: 900; letter-spacing: -.01em; }
  .brand span { color: #34d399; }

  /* right: calendar + event tickets */
  .cal { position: absolute; left: 742px; top: 104px; width: 330px; height: 330px; border-radius: 30px; transform: rotate(5deg);
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 2px solid rgba(255,255,255,.2);
    box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden; }
  .cal .top { height: 70px; background: linear-gradient(90deg, #4f46e5, #059669); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    font-weight: 900; font-size: 26px; letter-spacing: .12em; }
  .cal .top small { font-size: 16px; letter-spacing: .05em; opacity: .85; font-weight: 700; }
  .rings { position: absolute; top: -10px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 60px; }
  .rings i { width: 14px; height: 30px; border-radius: 8px; background: #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; padding: 18px 20px; }
  .days b { height: 30px; border-radius: 9px; background: rgba(255,255,255,.07); position: relative; }
  .days b.e1 { background: #34d399; box-shadow: 0 0 18px rgba(52,211,153,.7); }
  .days b.e2 { background: #818cf8; box-shadow: 0 0 18px rgba(129,140,248,.7); }
  .days b.e3 { background: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,.6); }
  .days b.e4 { background: #f472b6; box-shadow: 0 0 18px rgba(244,114,182,.6); }

  .tk { position: absolute; display: flex; align-items: center; gap: 14px; background: #0f172a; border: 2px solid rgba(255,255,255,.14);
    border-radius: 20px; padding: 12px 18px 12px 12px; box-shadow: 0 20px 50px rgba(0,0,0,.55); }
  .tk .ic { width: 54px; height: 54px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .tk .k { font-size: 15px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .tk .w { font-size: 22px; font-weight: 800; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .tk .w img { height: 17px; width: 23px; border-radius: 3px; object-fit: cover; }
  .t1 { left: 680px; top: 360px; transform: rotate(-3deg); }
  .t1 .ic { background: linear-gradient(135deg, #10b981, #0d9488); } .t1 .k { color: #6ee7b7; }
  .t2 { left: 900px; top: 448px; transform: rotate(2deg); }
  .t2 .ic { background: linear-gradient(135deg, #6366f1, #8b5cf6); } .t2 .k { color: #a5b4fc; }
  .t3 { left: 990px; top: 30px; transform: rotate(4deg); }
  .t3 .ic { background: linear-gradient(135deg, #f59e0b, #ef4444); } .t3 .k { color: #fcd34d; }
  .spark { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff; }
</style></head>
<body>
<div class="glow1"></div><div class="glow2"></div><div class="grid"></div>

<div class="wrap">
  <div class="tag"><i></i>Updated every 6 hours</div>
  <h1>Tech Events<br><span>in Africa</span></h1>
  <div class="sub">Conferences, meetups, hackathons &amp; classes.<br>All in one calendar.</div>
  <div class="flags">
    <span class="fl"><img src="../../public/flags/gh.svg">Ghana</span>
    <span class="fl"><img src="../../public/flags/ng.svg">Nigeria</span>
    <span class="fl"><img src="../../public/flags/ke.svg">Kenya</span>
    <span class="fl"><img src="../../public/flags/za.svg">South Africa</span>
    <span class="fl more">+ more across Africa</span>
  </div>
</div>

<!-- calendar -->
<div class="cal">
  <div class="rings"><i></i><i></i><i></i></div>
  <div class="top">EVENTS</div>
  <div class="days">
    <b></b><b></b><b class="e1"></b><b></b><b></b><b></b><b></b>
    <b></b><b class="e2"></b><b></b><b></b><b class="e3"></b><b></b><b></b>
    <b></b><b></b><b></b><b class="e1"></b><b></b><b></b><b class="e4"></b>
    <b class="e2"></b><b></b><b></b><b></b><b></b><b class="e1"></b><b></b>
    <b></b><b></b><b class="e3"></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b class="e2"></b><b></b><b></b>
  </div>
</div>

<!-- tickets -->
<div class="tk t3">
  <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
  <div><div class="k">Hackathon</div><div class="w"><img src="../../public/flags/ng.svg">Lagos</div></div>
</div>
<div class="tk t1">
  <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></div>
  <div><div class="k">Conference</div><div class="w"><img src="../../public/flags/gh.svg">Accra</div></div>
</div>
<div class="tk t2">
  <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
  <div><div class="k">Meetup</div><div class="w"><img src="../../public/flags/ke.svg">Nairobi</div></div>
</div>

<i class="spark" style="left:712px;top:120px;width:6px;height:6px"></i>
<i class="spark" style="left:1110px;top:300px;width:5px;height:5px"></i>
<i class="spark" style="left:860px;top:560px;width:4px;height:4px;opacity:.7"></i>

<div class="foot"><b>techtrendi.com</b>/tech-events</div>
<div class="brand">Tech<span>Trendi</span></div>
</body></html>
